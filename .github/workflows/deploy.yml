name: Deploy SportsHub Social

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: sportshubregistry.azurecr.io
  IMAGE_NAME: sportshub-api

jobs:
  # ── Job 1: Testes ──────────────────────────────────────────────
  test:
    name: Lint & Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm ci

      - name: Correr ESLint
        working-directory: backend
        run: npm run lint

      - name: Correr testes
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test

  # ── Job 2: Build & Push Docker ─────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extrair metadata da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Job 3: Deploy para Azure App Service ───────────────────────
  deploy:
    name: Deploy para Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://sportshub-api.azurewebsites.net

    steps:
      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy para Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: sportshub-api
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Health Check após deploy
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sportshub-api.azurewebsites.net/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check falhou! Status: $STATUS"
            exit 1
          fi
          echo "✓ Deploy bem-sucedido! Status: $STATUS"

  # ── Job 4: Deploy das Azure Functions ──────────────────────────
  deploy-functions:
    name: Deploy Azure Functions
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências das Functions
        working-directory: backend/functions
        run: npm ci

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: sportshub-functions
          package: backend/functions
          respect-funcignore: true

  # ── Job 5: Build & Deploy Frontend (Blob Storage Static Website) ─
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Build do frontend (com URL Azure)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://sportshub-api.azurewebsites.net/api

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy para Azure Blob Storage (Static Website)
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --account-name sportshubstorage \
              --destination '$web' \
              --source frontend/dist \
              --overwrite true
